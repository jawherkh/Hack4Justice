<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Frame: a squared, grid-built ring (Kufi-inspired construction) = the registry stamp / "proof" -->
  <rect x="16" y="16" width="68" height="14" rx="7" fill="#2563eb"/>
  <rect x="16" y="70" width="68" height="14" rx="7" fill="#2563eb"/>
  <rect x="16" y="16" width="14" height="68" rx="7" fill="#2563eb"/>
  <rect x="70" y="16" width="14" height="68" rx="7" fill="#2563eb"/>
  <!-- Two footsteps inside the frame, descending right-to-left = the guided path / "دليل" -->
  <rect x="44" y="32" width="12" height="12" rx="3" fill="#1e40af"/>
  <rect x="32" y="50" width="12" height="12" rx="3" fill="#1e40af"/>
</svg>
