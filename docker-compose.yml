version: "3.9"

# ─────────────────────────────────────────────
#  hack4justice – local development stack
#
#  Services
#  ├── Infrastructure
#  │   ├── postgres        app database
#  │   ├── neo4j           Graphiti graph backend
#  │   ├── minio           local S3-compatible file storage
#  │   ├── temporal        workflow engine
#  │   └── temporal-ui     Temporal web console
#  ├── TypeScript (Backend/)
#  │   ├── api             web API
#  │   └── worker-dossier  dossier orchestration worker
#  └── Python (agent/)
#      ├── agent           graph migration + shared code
#      ├── worker-graph    graph ingestion worker
#      └── worker-sandbox  sandbox execution worker
# ─────────────────────────────────────────────

x-temporal-env: &temporal-env
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}

services:
  # ── App database ──────────────────────────
  postgres:
    image: postgres:16.3-alpine
    container_name: h4j_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-h4j}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
      POSTGRES_DB: ${POSTGRES_DB:-h4j_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-h4j} -d ${POSTGRES_DB:-h4j_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Graphiti graph backend (Neo4j) ────────
  neo4j:
    image: neo4j:5.20.0-community
    container_name: h4j_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in your local environment}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in your local environment}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 6

  # ── File storage (MinIO / S3-compatible) ──
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: h4j_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-h4jadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in your local environment}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Temporal server ───────────────────────
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: h4j_temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-h4j}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
      POSTGRES_SEEDS: postgres
      TEMPORAL_ADDRESS: 0.0.0.0:7233
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./infra/temporal:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:2.28.0
    container_name: h4j_temporal_ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8088:8080"

  # ════════════════════════════════════════════
  #  TypeScript backend  (./Backend)
  # ════════════════════════════════════════════

  # ── Web API ───────────────────────────────
  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      target: development
    container_name: h4j_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./Backend/src:/app/src          # hot-reload in dev
      - ./Backend/prisma:/app/prisma
    command: ["npm", "run", "dev"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Dossier orchestration worker (TS) ─────
  worker-dossier:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      target: development
    container_name: h4j_worker_dossier
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *temporal-env
      WORKER_QUEUE: ${QUEUE_DOSSIER_ORCHESTRATION:-dossier-orchestration}
    command: ["npm", "run", "worker:dossier"]

  # ════════════════════════════════════════════
  #  Python agent backend  (./agent)
  # ════════════════════════════════════════════

  # ── Agent base (also used for one-off commands) ──
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
      target: development
    container_name: h4j_agent
    restart: "no"          # started on-demand (e.g. npm run demo)
    depends_on:
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *temporal-env
    # Default: run health check; override with docker compose run agent <cmd>
    command: ["python", "-m", "agent.scripts.health_check"]

  # ── Graph ingestion worker (Python) ───────
  worker-graph:
    build:
      context: ./agent
      dockerfile: Dockerfile
      target: development
    container_name: h4j_worker_graph
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      temporal:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *temporal-env
      WORKER_QUEUE: ${QUEUE_GRAPH_INGESTION:-graph-ingestion}
    command: ["python", "-m", "agent.workers.graph_ingestion_worker"]

  # ── Sandbox execution worker (Python) ─────
  worker-sandbox:
    build:
      context: ./agent
      dockerfile: Dockerfile
      target: development
    container_name: h4j_worker_sandbox
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      temporal:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *temporal-env
      WORKER_QUEUE: ${QUEUE_SANDBOX_EXECUTION:-sandbox-execution}
    command: ["python", "-m", "agent.workers.sandbox_execution_worker"]

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
