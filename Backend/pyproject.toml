[project]
name = "hack4justice-contracts"
version = "0.1.0"
description = "Shared domain and integration contracts for Hack4Justice"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
