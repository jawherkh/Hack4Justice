[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hack4justice-agent"
version = "0.1.0"
description = "hack4justice – Python agent backend (Graphiti/Neo4j, Temporal workers, sandbox execution)"
requires-python = ">=3.11"

dependencies = [
    # Temporal Python SDK
    "temporalio==1.7.1",
    # Graphiti – graph memory layer over Neo4j
    "graphiti-core==0.3.17",
    # Neo4j driver (pinned to match graphiti-core's requirement)
    "neo4j==5.21.0",
    # MinIO S3-compatible storage
    "minio==7.2.7",
    # HTTP client (used by agent activities)
    "httpx==0.27.0",
    # Settings / env management
    "pydantic-settings==2.3.4",
    "pydantic==2.7.4",
    # Logging
    "structlog==24.2.0",
    # Async utilities
    "anyio==4.4.0",
    # OpenAI (LLM backbone for Graphiti)
    "openai==1.35.13",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "ruff==0.5.0",
    "mypy==1.10.1",
    "types-minio==7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
