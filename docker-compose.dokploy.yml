services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-hack4justice}
    volumes:
      - h4j-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hack4justice}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - h4j-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-change-me-minio}
        && mc mb --ignore-existing local/${S3_BUCKET:-hack4justice}
    restart: "no"

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-neo4j}
    volumes:
      - h4j-neo4j-data:/data
      - h4j-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  graphiti:
    build:
      context: .
      dockerfile: apps/graphiti/Dockerfile
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-neo4j}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GRAPHITI_HOST: 0.0.0.0
      GRAPHITI_PORT: 8010
      GRAPHITI_CORS_ORIGINS: ${GRAPHITI_CORS_ORIGINS:-http://localhost:8080}
      GRAPHITI_STARTUP_CONNECT: "false"
      GRAPHITI_UPDATE_COMMUNITIES: ${GRAPHITI_UPDATE_COMMUNITIES:-false}
      GRAPHITI_MAX_COROUTINES: ${GRAPHITI_MAX_COROUTINES:-10}
      GRAPHITI_MAX_TEXT_CHARS: ${GRAPHITI_MAX_TEXT_CHARS:-12000}
      GRAPHITI_CHUNK_OVERLAP_CHARS: ${GRAPHITI_CHUNK_OVERLAP_CHARS:-400}
      GRAPHITI_INGEST_MAX_RETRIES: ${GRAPHITI_INGEST_MAX_RETRIES:-3}
      GRAPHITI_INGEST_RETRY_BASE_SECONDS: ${GRAPHITI_INGEST_RETRY_BASE_SECONDS:-2}
      GRAPHITI_INGEST_RETRY_MAX_SECONDS: ${GRAPHITI_INGEST_RETRY_MAX_SECONDS:-30}
    depends_on:
      neo4j:
        condition: service_healthy

  temporal-init:
    image: temporalio/temporal:1.8.3
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /data"]
    volumes:
      - h4j-temporal:/data
    restart: "no"

  temporal:
    image: temporalio/temporal:1.8.3
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db
    depends_on:
      temporal-init:
        condition: service_completed_successfully
    volumes:
      - h4j-temporal:/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8082}
    restart: unless-stopped
    command: ["node", "docker/start-api.mjs"]
    environment:
      PORT: 3001
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:8081}
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET:-change-me-admin-auth-secret-32-chars}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-hack4justice}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-better-auth-secret-32-chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8082}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-minio}
      S3_BUCKET: ${S3_BUCKET:-hack4justice}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_OCR_ENDPOINT: ${DEEPSEEK_OCR_ENDPOINT:-https://api.deepseek.com/chat/completions}
      DEEPSEEK_OCR_MODEL: ${DEEPSEEK_OCR_MODEL:-deepseek-flash}
      GRAPHITI_URL: http://graphiti:8010
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-gemini-2.5-flash}
      GEMINI_AGENT_BASE_URL: ${GEMINI_AGENT_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-alpine:3.20}
      SANDBOX_BASE_DIR: ${SANDBOX_BASE_DIR:-.local-data/agent-sandboxes}
      DOCUMENT_STORAGE_DIR: ${DOCUMENT_STORAGE_DIR:-.local-data/documents}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-dossier-lifecycle}
      DEMO_ACCESS_ENABLED: "false"
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-admin@dalil.local}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-change-me-now-12}
      SEED_SUPERADMIN_NAME: ${SEED_SUPERADMIN_NAME:-Super Admin}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
    ports:
      - "8082:3001"
    volumes:
      - h4j-documents:/app/.local-data
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      graphiti:
        condition: service_started
      temporal:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8082}
    restart: unless-stopped
    command: ["node", "docker/start-worker.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-hack4justice}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-better-auth-secret-32-chars}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-minio}
      S3_BUCKET: ${S3_BUCKET:-hack4justice}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_OCR_ENDPOINT: ${DEEPSEEK_OCR_ENDPOINT:-https://api.deepseek.com/chat/completions}
      DEEPSEEK_OCR_MODEL: ${DEEPSEEK_OCR_MODEL:-deepseek-flash}
      GRAPHITI_URL: http://graphiti:8010
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-gemini-2.5-flash}
      GEMINI_AGENT_BASE_URL: ${GEMINI_AGENT_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-alpine:3.20}
      SANDBOX_BASE_DIR: ${SANDBOX_BASE_DIR:-.local-data/agent-sandboxes}
      DOCUMENT_STORAGE_DIR: ${DOCUMENT_STORAGE_DIR:-.local-data/documents}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-dossier-lifecycle}
    volumes:
      - h4j-documents:/app/.local-data
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8082}
    restart: unless-stopped
    command: ["node", "docker/tanstack-server.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      H4J_APP_DIR: /app/apps/web
    ports:
      - "8080:3000"
    depends_on:
      api:
        condition: service_started

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8082}
    restart: unless-stopped
    command: ["node", "docker/tanstack-server.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      H4J_APP_DIR: /app/apps/admin
    ports:
      - "8081:3002"
    depends_on:
      api:
        condition: service_started

volumes:
  h4j-pgdata:
  h4j-minio:
  h4j-neo4j-data:
  h4j-neo4j-logs:
  h4j-temporal:
  h4j-documents:
