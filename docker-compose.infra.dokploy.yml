services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-hack4justice}
    volumes:
      - h4j-pgdata:/var/lib/postgresql/data
    networks:
      - h4j-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hack4justice}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    ports:
      - "9000:9000"
    volumes:
      - h4j-minio:/data
    networks:
      - h4j-private
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-change-me-minio}; do sleep 2; done
        && until mc mb --ignore-existing local/${S3_BUCKET:-hack4justice}; do sleep 2; done
    networks:
      - h4j-private
    restart: "no"

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-neo4j}
    volumes:
      - h4j-neo4j-data:/data
      - h4j-neo4j-logs:/logs
    networks:
      - h4j-private
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  graphiti:
    build:
      context: .
      dockerfile: apps/graphiti/Dockerfile
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-neo4j}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GRAPHITI_HOST: 0.0.0.0
      GRAPHITI_PORT: 8010
      GRAPHITI_CORS_ORIGINS: ${GRAPHITI_CORS_ORIGINS:-http://localhost:8080}
      GRAPHITI_STARTUP_CONNECT: "false"
      GRAPHITI_UPDATE_COMMUNITIES: ${GRAPHITI_UPDATE_COMMUNITIES:-false}
      GRAPHITI_MAX_COROUTINES: ${GRAPHITI_MAX_COROUTINES:-10}
      GRAPHITI_MAX_TEXT_CHARS: ${GRAPHITI_MAX_TEXT_CHARS:-12000}
      GRAPHITI_CHUNK_OVERLAP_CHARS: ${GRAPHITI_CHUNK_OVERLAP_CHARS:-400}
      GRAPHITI_INGEST_MAX_RETRIES: ${GRAPHITI_INGEST_MAX_RETRIES:-3}
      GRAPHITI_INGEST_RETRY_BASE_SECONDS: ${GRAPHITI_INGEST_RETRY_BASE_SECONDS:-2}
      GRAPHITI_INGEST_RETRY_MAX_SECONDS: ${GRAPHITI_INGEST_RETRY_MAX_SECONDS:-30}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - h4j-private

  temporal-init:
    image: temporalio/temporal:1.8.3
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /data"]
    volumes:
      - h4j-temporal:/data
    networks:
      - h4j-private
    restart: "no"

  temporal:
    image: temporalio/temporal:1.8.3
    restart: unless-stopped
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db
    depends_on:
      temporal-init:
        condition: service_completed_successfully
    volumes:
      - h4j-temporal:/data
    networks:
      - h4j-private

networks:
  h4j-private:
    external: true
    name: h4j-private

volumes:
  h4j-pgdata:
    external: true
    name: h4j-prod-jmecmv_h4j-pgdata
  h4j-minio:
    external: true
    name: h4j-prod-jmecmv_h4j-minio
  h4j-neo4j-data:
    external: true
    name: h4j-prod-jmecmv_h4j-neo4j-data
  h4j-neo4j-logs:
    external: true
    name: h4j-prod-jmecmv_h4j-neo4j-logs
  h4j-temporal:
    external: true
    name: h4j-prod-jmecmv_h4j-temporal
